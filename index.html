<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="張語真的個人成果網站：作品展示、AI 數值方法課程作業與上課筆記。">
<title>個人成果網站｜413210518 張語真</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 純白底；頁首姓名，下方左側直式選單（上下各一條槓、顯示數量），右側為內容 */
:root{
  --bg:#ffffff; --paper:#ffffff;
  --fg:#18222d; --muted:#5d6b78; --line:#e3e7ec;
  --ink:#1f5f8b; --ink-soft:#eef4f9; --mark:#b4532a;
  --ok:#2f7d4f; --ok-soft:#e1f1e7; --warn:#a86a10; --warn-soft:#f8ecd6;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:40px 64px}
header{display:grid;gap:8px;padding-bottom:28px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,9vw,64px);line-height:1.1;margin:0;letter-spacing:.06em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:16px}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;align-items:start}
nav{display:flex;flex-direction:column;border-top:3px solid var(--fg);border-bottom:3px solid var(--fg);padding-block:8px;position:sticky;top:16px}
nav button{font:inherit;font-weight:500;font-size:15px;border:none;background:transparent;color:var(--muted);text-align:left;
  padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
nav button:hover{color:var(--fg);background:var(--ink-soft)}
nav button[aria-selected="true"]{color:var(--fg);font-weight:700;background:var(--ink-soft)}
nav button[aria-selected="true"] .count{background:var(--ink);color:#fff}
nav button:focus-visible,.item summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.count{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;background:var(--ink-soft);color:var(--ink);padding:0 7px;border-radius:9px}
.panel{background:var(--paper);border-top:3px solid var(--fg);border-bottom:3px solid var(--fg);padding:8px 0;min-width:0}
.list{list-style:none;margin:0;padding:0}
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:baseline;padding:14px 20px}
.item summary::-webkit-details-marker{display:none}
.item summary:hover{background:var(--ink-soft)}
.no{font-family:var(--f-mono);font-weight:600;color:var(--mark);font-size:14px;font-variant-numeric:tabular-nums}
.ttl{min-width:0;font-weight:700;font-size:16px}
.meta{display:block;font-weight:400;font-size:13px;color:var(--muted);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.todo{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.note{background:var(--ink-soft);color:var(--ink)}
.body{padding:0 20px 18px 98px;min-width:0}
.body p{margin:0 0 10px;max-width:65ch;white-space:pre-wrap;overflow-wrap:anywhere}
.body a{color:var(--ink)}
.body pre{font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);padding:10px 12px;overflow-x:auto;margin:0 0 10px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:13px;font-weight:500;border:1px solid var(--ink);padding:3px 10px;text-decoration:none}
.links a:hover{background:var(--ink);color:var(--paper)}
.empty{padding:36px 20px;text-align:left;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:12px 0}
.grid:empty{display:none}
.card{border:1px solid var(--line);background:var(--paper);min-width:0}
.card summary{list-style:none;cursor:pointer;display:grid;gap:6px;padding:16px}
.card summary::-webkit-details-marker{display:none}
.card summary:hover{background:var(--ink-soft)}
.card summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card[open]{grid-column:1/-1;border-color:var(--ink)}
.card .cat{font-family:var(--f-mono);font-size:12px;color:var(--mark);letter-spacing:.06em}
.card .ttl{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.4}
.card .tags{display:flex;flex-wrap:wrap;gap:6px}
.card .tags span{font-size:12px;background:var(--ink-soft);color:var(--ink);padding:1px 8px}
.card .body{padding:0 16px 16px}
.sid{font-family:var(--f-mono);font-variant-numeric:tabular-nums;margin-right:4px}
/* 右下角愛心與留言 */
.fb-toggle{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:14px;
  background:var(--fg);color:#fff;border:none;padding:10px 16px;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.fb-toggle:focus-visible,.fb button:focus-visible,.fb input:focus-visible,.fb textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.fb{position:fixed;right:16px;bottom:70px;z-index:20;width:min(340px,calc(100vw - 32px));max-height:min(520px,calc(100vh - 100px));display:flex;flex-direction:column;
  background:#fff;border:1px solid var(--line);border-top:3px solid var(--fg);box-shadow:0 10px 30px rgba(0,0,0,.14)}
.fb-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.fb-head strong{font-size:15px}
.fb-close{border:none;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.like{display:flex;align-items:center;gap:8px;font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--fg)}
.like .heart{color:#d23a5b;font-size:16px}
.like[aria-pressed="true"]{background:#fdebef;border-color:#f3b8c5}
.like:disabled{cursor:default}
.fb-list{list-style:none;margin:0;padding:6px 14px;overflow-y:auto;flex:1;min-height:60px}
.fb-list li{padding:8px 0;border-bottom:1px solid var(--line)}
.fb-list li:last-child{border-bottom:none}
.fb-list .who{font-weight:700;font-size:13px}
.fb-list .when{font-size:12px;color:var(--muted);margin-left:6px;font-family:var(--f-mono)}
.fb-list p{margin:2px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.fb-none{color:var(--muted);font-size:13px;padding:8px 0}
.fb form{display:grid;gap:6px;padding:10px 14px 14px;border-top:1px solid var(--line)}
.fb input,.fb textarea{font:inherit;font-size:14px;border:1px solid var(--line);padding:6px 8px;width:100%;background:#fff;color:var(--fg)}
.fb textarea{resize:vertical;min-height:60px}
.fb form button{font:inherit;font-weight:700;background:var(--ink);color:#fff;border:none;padding:8px;cursor:pointer}
.fb form button:disabled{opacity:.5;cursor:default}
.fb-msg{font-size:12px;color:var(--muted);min-height:1em}
footer{margin-top:24px;font-size:13px;color:var(--muted)}
@media (max-width:720px){
  .layout{grid-template-columns:1fr;gap:20px}
  nav{position:static}
}
@media (max-width:560px){
  .item summary{grid-template-columns:1fr auto;gap:4px 10px;padding:12px 16px}
  .no{grid-column:1/-1}
  .body{padding:0 16px 16px}
}
</style>
<style>body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>個人成果網站</h1>
    <p class="sub"><span class="sid">413210518</span> 張語真</p>
  </header>

  <div class="layout">
  <nav role="tablist" aria-orientation="vertical">
    <button role="tab" id="tab-pj" aria-selected="true" data-tab="pj">個人成果 <span class="count" id="c-pj">0</span></button>
    <button role="tab" id="tab-hw" aria-selected="false" data-tab="hw">作業 <span class="count" id="c-hw">0</span></button>
    <button role="tab" id="tab-lec" aria-selected="false" data-tab="lec">上課內容 <span class="count" id="c-lec">0</span></button>
  </nav>

  <main>
  <section class="panel" id="panel-pj" role="tabpanel">
    <div class="grid" id="list-pj"></div>
    <div class="empty" id="empty-pj"><strong>成果整理中</strong>作品、專題與獲獎紀錄即將更新。</div>
  </section>
  <section class="panel" id="panel-hw" role="tabpanel" hidden>
    <ul class="list" id="list-hw"></ul>
    <div class="empty" id="empty-hw"><strong>作業整理中</strong>AI 數值方法課程作業即將更新。</div>
  </section>
  <section class="panel" id="panel-lec" role="tabpanel" hidden>
    <ul class="list" id="list-lec"></ul>
    <div class="empty" id="empty-lec"><strong>筆記整理中</strong>每週上課重點即將更新。</div>
  </section>
  </main>
  </div>

  <footer id="foot">點擊任一項目可展開詳細內容。© 2026 張語真</footer>
</div>

<script>
const $ = s => document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function bodyHtml(d){
  let h="";
  if(d.content) h+=`<p>${linkify(d.content)}</p>`;
  if(d.code) h+=`<pre>${esc(d.code)}</pre>`;
  if(Array.isArray(d.links)&&d.links.length) h+=`<div class="links">${d.links.map(l=>/^https?:\/\//.test(l.url||"")?`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.url)}</a>`:"").join("")}</div>`;
  return h||`<p style="color:var(--muted)">尚無詳細內容。</p>`;
}
function renderHW(docs){
  $("#c-hw").textContent=docs.length; $("#empty-hw").hidden=docs.length>0;
  $("#list-hw").innerHTML=docs.map(d=>{
    const done=d.status==="done";
    const meta=[d.assigned&&`發布 ${esc(d.assigned)}`, d.due&&`截止 ${esc(d.due)}`].filter(Boolean).join(" · ");
    return `<li class="item"><details><summary><span class="no">${esc(d.no||"HW")}</span><span class="ttl">${esc(d.title)}${meta?`<span class="meta">${meta}</span>`:""}</span><span class="pill ${done?"done":"todo"}">${done?"已完成":"進行中"}</span></summary><div class="body">${bodyHtml(d)}</div></details></li>`}).join("");
}
function renderLec(docs){
  $("#c-lec").textContent=docs.length; $("#empty-lec").hidden=docs.length>0;
  $("#list-lec").innerHTML=docs.map(d=>`<li class="item"><details><summary><span class="no">${esc(d.week||"W")}</span><span class="ttl">${esc(d.title)}${d.date?`<span class="meta">${esc(d.date)}</span>`:""}</span><span class="pill note">筆記</span></summary><div class="body">${bodyHtml(d)}</div></details></li>`).join("");
}
function renderPj(docs){
  $("#c-pj").textContent=docs.length; $("#empty-pj").hidden=docs.length>0;
  $("#list-pj").innerHTML=docs.map(d=>{
    const top=[d.category,d.date].filter(Boolean).map(esc).join(" · ");
    const tags=Array.isArray(d.tags)&&d.tags.length?`<div class="tags">${d.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:"";
    return `<details class="card"><summary>${top?`<span class="cat">${top}</span>`:""}<span class="ttl">${esc(d.title)}</span>${d.summary?`<span style="color:var(--muted);font-size:14px">${esc(d.summary)}</span>`:""}${tags}</summary><div class="body">${bodyHtml(d)}</div></details>`}).join("");
}
const tabs=["pj","hw","lec"];
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  tabs.forEach(t=>$("#panel-"+t).hidden=b.dataset.tab!==t);
  try{localStorage.setItem("tab2",b.dataset.tab)}catch(e){}
}));
try{const t=localStorage.getItem("tab2"); if(tabs.includes(t)) $("#tab-"+t).click();}catch(e){}
const hashTab={"#portfolio":"pj","#homework":"hw","#lectures":"lec"}[location.hash]; if(hashTab) $("#tab-"+hashTab).click();

// ===== 網站內容：要新增項目就加在這三個清單裡 =====
const PROJECTS = [];
const ASSIGNMENTS = [];
const LECTURES = [];
const byOrder = a => [...a].sort((x,y)=>(x.order??0)-(y.order??0));
renderPj(byOrder(PROJECTS)); renderHW(byOrder(ASSIGNMENTS)); renderLec(byOrder(LECTURES));
</script>


<button class="fb-toggle" id="fb-toggle" aria-expanded="false" aria-controls="fb"><span style="color:#ff8fa8">❤</span> <span id="fb-toggle-n">0</span> · 留言</button>
<section class="fb" id="fb" hidden aria-label="愛心與留言">
  <div class="fb-head">
    <button class="like" id="like" aria-pressed="false"><span class="heart">❤</span><span id="like-n">0</span></button>
    <strong>留言板</strong>
    <button class="fb-close" id="fb-close" aria-label="關閉">×</button>
  </div>
  <ul class="fb-list" id="fb-list"><li class="fb-none">還沒有留言，來寫第一則吧。</li></ul>
  <form id="fb-form">
    <input id="fb-name" maxlength="30" placeholder="你的名字（可不填）" autocomplete="nickname">
    <textarea id="fb-text" maxlength="500" placeholder="寫下你的評論…" required></textarea>
    <button type="submit" id="fb-send">送出留言</button>
    <div class="fb-msg" id="fb-msg" role="status"></div>
  </form>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== Firebase 設定：把 Firebase 給你的 firebaseConfig 貼在這裡 =====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB94ELPZjkqnXBekkRxZfkXLyeZWC6beQM",
  authDomain: "yuchensite-4fdc3.firebaseapp.com",
  projectId: "yuchensite-4fdc3",
  storageBucket: "yuchensite-4fdc3.firebasestorage.app",
  messagingSenderId: "34472682776",
  appId: "1:34472682776:web:4af10ed202b66af879aa6d"
};

(function(){
  const box=document.getElementById("fb"), tg=document.getElementById("fb-toggle");
  const open=v=>{box.hidden=!v; tg.setAttribute("aria-expanded",v)};
  tg.onclick=()=>open(box.hidden); document.getElementById("fb-close").onclick=()=>open(false);
  const msg=t=>document.getElementById("fb-msg").textContent=t;
  const likeBtn=document.getElementById("like"), send=document.getElementById("fb-send");
  const setN=n=>{document.getElementById("like-n").textContent=n;document.getElementById("fb-toggle-n").textContent=n};
  let liked=false; try{liked=localStorage.getItem("liked")==="1"}catch(e){}
  likeBtn.setAttribute("aria-pressed",liked);
  if(!FIREBASE_CONFIG||typeof firebase==="undefined"){likeBtn.disabled=true;send.disabled=true;msg("留言功能設定中，敬請期待。");return;}
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.firestore(), likeRef=db.doc("stats/likes");
  likeRef.onSnapshot(d=>setN(d.exists?(d.data().count||0):0),()=>{});
  likeBtn.onclick=async()=>{
    if(liked) return; liked=true; likeBtn.setAttribute("aria-pressed","true");
    try{localStorage.setItem("liked","1")}catch(e){}
    try{await likeRef.set({count:firebase.firestore.FieldValue.increment(1)},{merge:true})}
    catch(e){liked=false;likeBtn.setAttribute("aria-pressed","false");try{localStorage.removeItem("liked")}catch(_){};msg("按讚失敗，請稍後再試。")}
  };
  const list=document.getElementById("fb-list");
  db.collection("comments").orderBy("createdAt","desc").limit(100).onSnapshot(snap=>{
    list.textContent="";
    if(snap.empty){const li=document.createElement("li");li.className="fb-none";li.textContent="還沒有留言，來寫第一則吧。";list.append(li);return;}
    snap.forEach(doc=>{const d=doc.data();const li=document.createElement("li");
      const w=document.createElement("span");w.className="who";w.textContent=d.name||"匿名";
      const t=document.createElement("span");t.className="when";
      const dt=d.createdAt&&d.createdAt.toDate?d.createdAt.toDate():null;
      t.textContent=dt?`${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`:"剛剛";
      const p=document.createElement("p");p.textContent=d.text;li.append(w,t,p);list.append(li);});
  },()=>msg("留言載入失敗，請重新整理。"));
  document.getElementById("fb-form").addEventListener("submit",async e=>{
    e.preventDefault();
    const name=document.getElementById("fb-name").value.trim().slice(0,30);
    const ta=document.getElementById("fb-text"), text=ta.value.trim().slice(0,500);
    if(!text){msg("請先寫點內容。");return;}
    send.disabled=true; msg("送出中…");
    try{await db.collection("comments").add({name,text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});ta.value="";msg("已送出，謝謝你的留言！")}
    catch(err){msg("送出失敗，請稍後再試。")}
    send.disabled=false;
  });
})();
</script>
</body>
